name: Aggiorna dati e pubblica

on:
  schedule:
    - cron: "40 4 * * 2-6"   # 05:40 ora italiana (inverno), dopo la chiusura USA di lun-ven
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r tools/requirements.txt
      - name: Scarica la copertina PDF esportata da Canva (se indicata)
        run: |
          if [ -f assets/cover_url.txt ]; then
            curl -sfL -o assets/pdf_cover.jpg "$(head -n1 assets/cover_url.txt)" && rm assets/cover_url.txt || echo "download copertina non riuscito"
          fi
      - name: Scarica i dati del giorno precedente
        run: timeout 2400 python tools/update.py || echo "aggiornamento interrotto"
        env:
          UPDATE_BUDGET: "1800"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Salva i dati nel repository
        if: always()
        run: |
          git config user.name "quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data assets
          git rm -q --cached assets/cover_url.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Dati aggiornati $(date -u +%F)"
          git pull --rebase -X ours origin main || true
          git push || true
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
