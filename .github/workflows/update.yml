name: Aggiorna dati e pubblica

on:
  schedule:
    - cron: "40 4 * * 2-6"   # 05:40 ora italiana (inverno), dopo la chiusura USA di lun-ven
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r tools/requirements.txt
      - name: Scarica i dati del giorno precedente
        run: python tools/update.py
      - name: Salva i dati nel repository
        run: |
          git config user.name "quant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dati aggiornati $(date -u +%F)"
          git pull --rebase -X ours origin main || true
          git push || true
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
